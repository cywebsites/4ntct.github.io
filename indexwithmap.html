<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>南投縣生生有平板達標宣布活動</title>
  
  <link rel="icon" href="42531_f5.png?v=2" type="image/png">
  <link rel="shortcut icon" href="42531_f5.png?v=2" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      80% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes float-particle {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
      50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
    }
    @keyframes progressBump {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 113, 69, 0.8); border-color: rgba(255, 113, 69, 1); }
      100% { transform: scale(1); }
    }
    @keyframes badgePulse {
      0%, 100% { transform: rotate(-2deg) scale(1); filter: brightness(1); box-shadow: 0 0 15px rgba(255, 113, 69, 0.6); }
      50% { transform: rotate(-2deg) scale(1.1); filter: brightness(1.05); box-shadow: 0 0 40px rgba(255, 113, 69, 1), inset 0 0 15px rgba(255, 255, 255, 0.6); }
    }
    @keyframes litTabletGlow {
      0%, 100% { box-shadow: 0 5px 15px rgba(49, 126, 224, 0.5); filter: brightness(1); }
      50% { box-shadow: 0 0 30px rgba(49, 126, 224, 1); filter: brightness(1.15); }
    }
    @keyframes progress-stripes-anim {
      from { background-position: 1.5rem 0; }
      to { background-position: 0 0; }
    }
    /* 地圖專屬閃爍放大特效 */
    @keyframes mapGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8)) drop-shadow(0 0 25px rgba(49, 126, 224, 0.4)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 20px rgba(255, 255, 255, 1)) drop-shadow(0 0 50px rgba(49, 126, 224, 0.8)); transform: scale(1.03); }
    }
    .progress-stripes {
      background-image: linear-gradient(
        -45deg,
        rgba(255, 255, 255, 0.25) 25%,
        transparent 25%,
        transparent 50%,
        rgba(255, 255, 255, 0.25) 50%,
        rgba(255, 255, 255, 0.25) 75%,
        transparent 75%,
        transparent
      );
      background-size: 1.5rem 1.5rem;
      animation: progress-stripes-anim 1s linear infinite;
    }
    /* 強烈白色外框特效 (確保任何背景下都清晰) */
    .title-outline {
      color: #317EE0;
      -webkit-text-stroke: 4px white;
      paint-order: stroke fill;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
    }
    @media (min-width: 768px) {
      .title-outline { -webkit-text-stroke: 5px white; }
    }
    @supports not (paint-order: stroke fill) {
      .title-outline {
        -webkit-text-stroke: 0;
        text-shadow:
          -3px -3px 0 #fff, 0 -3px 0 #fff, 3px -3px 0 #fff,
           3px  0   0 #fff, 3px  3px 0 #fff, 0  3px 0 #fff,
          -3px  3px 0 #fff, -3px  0   0 #fff;
      }
    }
    .animate-pop-in { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .animate-progress-bump { animation: progressBump 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .animate-badge-pulse { animation: badgePulse 1.2s ease-in-out infinite; }
    .animate-lit-tablet { animation: litTabletGlow 1.5s ease-in-out infinite; }
    .animate-map-glow { animation: mapGlow 2.5s ease-in-out infinite; }
    .grid-bg {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(49, 126, 224, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(49, 126, 224, 0.08) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-sky-50 via-blue-50 to-indigo-50 font-sans text-slate-800 overflow-x-hidden relative min-h-screen flex flex-col">
  
  <!-- ============================================== -->
  <!-- 隱藏的切換身分小齒輪 (放在右上角) -->
  <!-- ============================================== -->
  <button onclick="document.getElementById('role-modal').classList.remove('hidden')" class="fixed top-4 right-4 z-[90] p-2 md:p-3 text-slate-400 hover:text-[#317EE0] bg-white/60 hover:bg-white rounded-full transition-all shadow-sm opacity-60 hover:opacity-100 backdrop-blur-sm border border-slate-200" title="切換身分">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 md:w-6 md:h-6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>

  <!-- ============================================== -->
  <!-- 1. 角色選擇大門 -->
  <!-- ============================================== -->
  <div id="role-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/90 backdrop-blur-sm p-4">
    <div class="bg-white border-4 border-[#317EE0] rounded-[2rem] p-6 md:p-12 shadow-2xl max-w-lg w-full text-center animate-pop-in">
      <img src="42530_f6.png" class="h-10 mx-auto mb-6" alt="南投縣政府" onerror="this.style.display='none'">
      <h2 class="text-3xl md:text-4xl font-black text-[#317EE0] mb-8 tracking-wider">選擇活動身分</h2>
      <div class="flex flex-col gap-4">
        <button onclick="window.selectRole('admin')" class="w-full py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-2xl text-xl transition-transform hover:scale-105 shadow-sm border border-slate-300 flex justify-center items-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <span>管理者 (工作人員)</span>
        </button>
        <button onclick="window.selectRole('lighter')" class="w-full py-4 bg-[#FF7145] hover:bg-[#E65C30] text-white font-bold rounded-2xl text-xl transition-transform hover:scale-105 shadow-md flex justify-center items-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
          <span>貴賓 (現場參與)</span>
        </button>
        <button onclick="window.selectRole('mayor')" class="w-full py-4 bg-[#317EE0] hover:bg-[#2563B0] text-white font-bold rounded-2xl text-xl transition-transform hover:scale-105 shadow-md flex justify-center items-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M18.36 6.64A9 9 0 0 1 21 13a9 9 0 1 1-18 0 9 9 0 0 1 2.64-6.36"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
          <span>縣長 (達標啟動)</span>
        </button>
      </div>
      <p class="text-xs text-slate-400 mt-6">系統將自動為您連線並同步音效</p>
    </div>
  </div>

  <!-- 地圖與網格背景 -->
  <div class="fixed inset-0 z-0 pointer-events-none flex items-center justify-center opacity-60 mix-blend-multiply">
    <img src="nantoumap4.png" alt="南投縣地圖" class="w-full h-full object-contain p-0 md:p-4 scale-110 md:scale-105" onerror="this.style.display='none'">
  </div>
  <div class="absolute inset-0 grid-bg pointer-events-none z-0"></div>
  <div class="absolute top-0 left-0 w-full h-[300px] bg-gradient-to-b from-white/70 to-transparent pointer-events-none z-0"></div>

  <!-- 頂部標題與進度條 -->
  <header class="relative z-10 pt-4 pb-2 px-4 text-center">
    <h1 class="text-4xl md:text-6xl font-black mb-3 tracking-widest title-outline flex items-baseline justify-center">
      <img src="title_tou.png" alt="投" class="h-[1.2em] md:h-[1.3em] inline-block mr-1 md:mr-3 transform translate-y-1 md:translate-y-2" style="filter: drop-shadow(1.5px 1.5px 0 white) drop-shadow(-1.5px -1.5px 0 white) drop-shadow(1.5px -1.5px 0 white) drop-shadow(-1.5px 1.5px 0 white) drop-shadow(0 3px 4px rgba(0,0,0,0.1));" onerror="this.style.display='none'">入數位 學力全開
    </h1>
    <p class="text-slate-600 text-base md:text-lg font-medium max-w-2xl mx-auto leading-snug">
      生生有平板，讓每個角落都充滿學習的亮光！
    </p>
    
    <div id="progress-container" class="mt-4 md:mt-6 w-11/12 md:w-4/5 max-w-4xl mx-auto bg-white rounded-full h-10 md:h-14 border-[3px] border-[#FF7145]/30 p-1.5 md:p-2 relative shadow-inner overflow-hidden transition-all duration-300 z-20">
      <div id="progress-bar-fill" class="h-full bg-[#FF7145] rounded-full transition-all duration-1000 ease-out relative shadow-sm overflow-hidden" style="width: 0%;">
         <div class="absolute inset-0 progress-stripes"></div>
         <div class="absolute top-0 right-0 bottom-0 w-6 bg-gradient-to-l from-white/80 to-transparent rounded-r-full"></div>
      </div>
      <div id="progress-text" class="absolute inset-0 flex items-center justify-center text-base md:text-2xl font-black text-slate-700 drop-shadow-[0_1px_2px_rgba(255,255,255,1)] tracking-wide">
        完成度 0% (0/13)
      </div>
    </div>
  </header>

  <!-- 遊戲主體：平板網格 -->
  <main class="relative z-10 max-w-6xl mx-auto px-2 md:px-4 pb-4 flex-grow w-full">
    <div id="loading-spinner" class="flex flex-col items-center justify-center py-20 text-[#317EE0]">
      <svg class="w-12 h-12 animate-pulse mb-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" x2="12.01" y1="20" y2="20"/></svg>
      <p class="text-lg font-bold tracking-widest">系統初始化中...</p>
    </div>
    
    <div id="tablet-grid" class="flex flex-col items-center gap-3 md:gap-4 mt-4 hidden">
      <!-- 內容由 JS 動態生成 -->
    </div>

    <!-- 1. 貴賓面板 (主畫面下方，到達99%時會自動隱藏) -->
    <div id="panel-lighter" class="relative z-40 w-full flex justify-center pt-8 pb-16 md:pb-24 hidden">
      <button onclick="window.handleLighterClick()" class="touch-manipulation select-none px-10 py-3 md:px-16 md:py-4 bg-[#FF7145] hover:bg-[#E65C30] text-white font-black rounded-full text-xl md:text-2xl transition-transform active:scale-95 shadow-[0_10px_20px_rgba(0,0,0,0.2)] border-4 border-[#FFD0C2] flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 md:w-8 md:h-8 animate-pulse"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
        <span>點擊進度</span>
      </button>
    </div>
  </main>

  <!-- 頁尾 Logo -->
  <footer class="fixed bottom-3 right-3 md:bottom-5 md:right-5 z-20 pointer-events-none">
    <img src="42530_f6.png" alt="南投縣政府" class="h-6 md:h-10 object-contain opacity-90 drop-shadow-md pointer-events-auto" onerror="this.style.display='none'">
  </footer>

  <!-- 隱形的佔位區塊：為主畫面管理者的底部按鈕預留空間 -->
  <div id="panel-spacer" class="w-full h-24 md:h-32 hidden"></div>

  <!-- 狀態文字 (左下角) -->
  <div class="fixed bottom-2 left-2 md:bottom-3 md:left-3 z-10 pointer-events-none">
    <span id="network-status" class="text-[10px] md:text-xs text-slate-400/60 font-light tracking-wide">等待選擇身分...</span>
  </div>

  <!-- ============================================== -->
  <!-- 🌟 升級版毛玻璃：99% 地圖集氣視窗 -->
  <!-- ============================================== -->
  <!-- 背景遮罩改為 85% 深度不透明並加上模糊，徹底遮擋主畫面文字 -->
  <div id="map-modal" class="fixed inset-0 z-[60] items-center justify-center bg-slate-900/85 backdrop-blur-md p-3 md:p-6 hidden flex overflow-hidden">
    
    <!-- 毛玻璃視窗本體 -->
    <div class="relative bg-white/60 backdrop-blur-2xl border-2 border-white/80 shadow-[0_8px_32px_rgba(0,0,0,0.3)] rounded-[2rem] md:rounded-[3rem] w-full max-w-[85rem] h-[92vh] md:h-[85vh] text-center animate-pop-in flex flex-col items-center p-4 md:p-8 lg:px-12">
      
      <!-- 內容區塊：桌面版左右排版，手機版上下排版 -->
      <div class="flex flex-col md:flex-row flex-1 w-full min-h-0 items-center justify-center gap-4 md:gap-12 lg:gap-16 mt-2">
        
        <!-- 左側/上方：放大的地圖 -->
        <div class="flex-1 w-full h-full relative flex justify-center items-center overflow-visible">
          <div class="absolute inset-0 bg-[radial-gradient(circle,rgba(255,215,0,0.15)_0%,rgba(49,126,224,0.1)_50%,transparent_70%)] animate-pulse rounded-full blur-[20px] pointer-events-none"></div>
          <img src="nantoumapBig.png" alt="南投縣地圖" class="w-full h-full object-contain animate-map-glow z-10 relative drop-shadow-[0_0_15px_rgba(255,255,255,0.6)] scale-[1.15] md:scale-[1.3] lg:scale-[1.45] transform origin-center" onerror="this.style.display='none'">
        </div>
        
        <!-- 右側/下方 按鈕與標題容器 (99%時所有人都能看到這個容器，藉此顯示標題) -->
        <div id="modal-right-panel" class="hidden w-full md:w-[380px] lg:w-[480px] xl:w-[520px] flex-col justify-center md:justify-start md:pt-16 lg:pt-24 items-center gap-8 md:gap-12 lg:gap-16 flex-shrink-0 z-20 bg-white/40 md:bg-transparent rounded-3xl p-6 md:p-0 shadow-sm md:shadow-none">
          
          <!-- 標題：所有人可見。固定不閃爍、超大字體、行距拉大、套用純白外框，桌面版自動分行 -->
          <h2 class="text-[2.75rem] sm:text-5xl md:text-6xl lg:text-[4.5rem] xl:text-[5.5rem] font-black py-2 tracking-widest flex-shrink-0 title-outline leading-[1.3] md:leading-[1.5]">
            南投縣<br class="hidden md:block"/>生生有平板
          </h2>

          <!-- 縣長專屬達標鍵 -->
          <div id="panel-mayor" class="w-full hidden">
            <button onclick="window.handleAdminTarget()" class="w-full pointer-events-auto touch-manipulation select-none px-6 py-4 md:py-6 lg:py-8 bg-gradient-to-r from-[#317EE0] to-[#5A9CF0] hover:from-[#2563B0] hover:to-[#317EE0] text-white font-black rounded-3xl md:rounded-[2rem] text-2xl md:text-4xl transition-transform active:scale-95 shadow-[0_10px_30px_rgba(49,126,224,0.6)] border-4 border-white flex justify-center items-center gap-3 animate-bounce">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 md:w-12 md:h-12"><path d="M18.36 6.64A9 9 0 0 1 21 13a9 9 0 1 1-18 0 9 9 0 0 1 2.64-6.36"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
              <span>啟動達標</span>
            </button>
          </div>

          <!-- 管理者專屬面板 (於99%時移入視窗右側) -->
          <div id="panel-admin-modal" class="w-full hidden flex-col gap-4 lg:gap-5">
            <!-- 音樂切換鈕 (管理者專屬) -->
            <button onclick="window.handleToggleBGM()" class="w-full px-6 py-3 lg:py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-3xl md:rounded-[2rem] text-lg md:text-2xl transition-transform active:scale-95 shadow-[0_10px_20px_rgba(16,185,129,0.4)] border-4 border-emerald-400 flex justify-center items-center gap-2">
              <span class="text-bgm-label">▶️ 播放音樂</span>
            </button>
            <button onclick="window.handleAdminTarget()" class="w-full px-6 py-3 lg:py-4 bg-[#317EE0] hover:bg-[#5A9CF0] text-white font-black rounded-3xl md:rounded-[2rem] text-lg md:text-2xl transition-transform active:scale-95 shadow-[0_10px_20px_rgba(49,126,224,0.4)] border-4 border-[#8AB9F5] flex justify-center items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 md:w-6 md:h-6"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              <span>強制達標 (備用)</span>
            </button>
            <button onclick="window.handleReset()" class="w-full px-6 py-3 lg:py-4 bg-slate-700/80 hover:bg-slate-600 text-white font-bold rounded-2xl md:rounded-3xl text-base md:text-lg transition-transform active:scale-95 shadow-sm border-2 border-slate-500 flex justify-center items-center">
              重置進度
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- 主畫面的底部操作面板 (管理者) -->
  <!-- ============================================== -->
  <div id="panel-admin" class="fixed bottom-0 left-0 w-full bg-slate-900/95 backdrop-blur-md border-t-4 border-slate-600 p-4 md:p-6 flex flex-wrap justify-center items-center gap-3 z-40 hidden shadow-[0_-10px_30px_rgba(0,0,0,0.2)]">
    <!-- 音樂切換鈕 -->
    <button onclick="window.handleToggleBGM()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-full transition-transform active:scale-95 shadow-sm border-2 border-emerald-400 flex items-center gap-2">
      <span class="text-bgm-label">▶️ 播放音樂</span>
    </button>
    <button onclick="window.handleAdminTarget()" class="px-5 py-2 bg-[#317EE0] hover:bg-[#5A9CF0] text-white font-bold rounded-full transition-transform active:scale-95 shadow-sm border-2 border-[#8AB9F5] flex items-center gap-2">
      <span>強制達標 (備用)</span>
    </button>

      <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-3/4 h-3/4 bg-blue-100/60 blur-[100px] rounded-full pointer-events-none z-0"></div>

      <div class="flex flex-col items-center my-auto w-full shrink min-h-0 pt-4 md:pt-0 z-30">

            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 md:w-5 md:h-5"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>

            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3 md:w-4 md:h-4"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>

        <button onclick="window.hideCelebrationModal()" class="px-4 py-2 md:px-6 md:py-2.5 bg-white hover:bg-slate-50 text-slate-600 font-bold rounded-full transition-colors border border-slate-300 shadow-md">

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot, increment } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // 🎵 載入所有音效
    const clickAudio = new Audio('click.mp3');       
    const celebrationAudio = new Audio('party.mp3'); 
    const tapAudio = new Audio('tap.mp3'); 
    const bgmAudio = new Audio('05lightering.mp3');

    // 背景音樂設定：循環播放，音量降低至 15% 避免蓋過點擊音效
    bgmAudio.loop = true;
    bgmAudio.volume = 0.15;
    
    // 紀錄音效是否已解鎖
    let isAudioUnlocked = false;

    function playClickSound() {
      try {
        clickAudio.currentTime = 0; 
        clickAudio.play().catch(()=>{});
      } catch (e) {}
    }

    function playTapSound() {
      try {
        tapAudio.currentTime = 0; 
        tapAudio.play().catch(()=>{});
      } catch (e) {}
    }

    function playCelebrationSound() {
      try {
        celebrationAudio.currentTime = 0;
        celebrationAudio.play().catch(()=>{});
      } catch (e) {}
    }

    function stopCelebrationSound() {
      try {
        celebrationAudio.pause();
        celebrationAudio.currentTime = 0;
      } catch (e) {}
    }

    // ==========================================
    // 🔥 Firebase 設定碼
    // ==========================================
    const myFirebaseConfig = {
      apiKey: "AIzaSyCWVUoWYFWBAqYYJjLfD1iLumZWTfuYMwg",
      authDomain: "tabletactive-c60bd.firebaseapp.com",
      projectId: "tabletactive-c60bd",
      storageBucket: "tabletactive-c60bd.firebasestorage.app",
      messagingSenderId: "161436470838",
      appId: "1:161436470838:web:ed3269e37a1f12c5211297",
      measurementId: "G-GK0B28W9L2"
    };
    // ==========================================

    const TOWNSHIPS = [
      { id: 'nantou', name: '南投市' }, { id: 'caotun', name: '草屯鎮' }, { id: 'puli', name: '埔里鎮' },
      { id: 'zhushan', name: '竹山鎮' }, { id: 'jiji', name: '集集鎮' }, { id: 'mingjian', name: '名間鄉' },
      { id: 'lugu', name: '鹿谷鄉' }, { id: 'zhongliao', name: '中寮鄉' }, { id: 'yuchi', name: '魚池鄉' },
      { id: 'guoxing', name: '國姓鄉' }, { id: 'shuili', name: '水里鄉' }, { id: 'xinyi', name: '信義鄉' },
      { id: 'renai', name: '仁愛鄉' }
    ];

    const LIGHTING_ORDER = [
      'renai', 'xinyi', 'shuili', 'guoxing', 'yuchi', 'zhongliao', 'lugu', 
      'mingjian', 'jiji', 'zhushan', 'puli', 'caotun', 'nantou'
    ];

    const ROLE_NAMES = {
      admin: '管理者',
      lighter: '貴賓',
      mayor: '縣長'
    };

    let state = {
      role: null, 
      globalProgress: 0,
      litCount: 0,
      isComplete: false,
      bgmPlaying: false, // 記錄背景音樂狀態
      useFirebase: false,
      user: null,
      confettiInterval: null
    };

    let db, appId;

    const SVGS = {
      tablet: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 md:w-8 md:h-8 text-slate-400 mb-1 md:mb-2"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg>`,
    };

    // ==========================================
    // 1. 身分選擇與音效解鎖 (🌟 解決不同步的關鍵)
    // ==========================================
    window.selectRole = (role) => {
      state.role = role;
      document.getElementById('role-modal').classList.add('hidden');
      
      // 隱藏所有面板，交由資料同步後 processNewState 判斷
      document.getElementById('panel-lighter').classList.add('hidden');
      document.getElementById('panel-admin').classList.add('hidden');
      document.getElementById('modal-right-panel').classList.add('hidden');
      document.getElementById('panel-spacer').classList.add('hidden'); 
      document.querySelectorAll('.admin-only-btn').forEach(el => el.classList.add('hidden'));
      
      if (role === 'admin') {
        document.querySelectorAll('.admin-only-btn').forEach(el => el.classList.remove('hidden'));
      }
      
      // 🔊 強制解鎖音效：在使用者點擊選擇身分的瞬間，以靜音模式觸發播放，取得瀏覽器許可
      if (!isAudioUnlocked) {
        const unlock = (audioObj) => {
          audioObj.muted = true;
          const playPromise = audioObj.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              // 如果是背景音樂且遠端已經指示正在播放，就直接解除靜音，不暫停
              if (audioObj === bgmAudio && state.bgmPlaying) {
                audioObj.muted = false;
              } else {
                audioObj.pause();
                audioObj.currentTime = 0;
                audioObj.muted = false;
              }
            }).catch(() => {});
          }
        };
        
        unlock(clickAudio);
        unlock(tapAudio);
        unlock(celebrationAudio);
        unlock(bgmAudio);
        isAudioUnlocked = true;
      }
      
      initFirebase();
    };

    function fallbackToOffline(errorMessage) {
      state.useFirebase = false;
      document.getElementById('network-status').innerText = errorMessage;
      document.getElementById('loading-spinner').classList.add('hidden');
      document.getElementById('tablet-grid').classList.remove('hidden');
      renderGrid();
      updateProgressUI();
    }

    async function initFirebase() {
      try {
        if (myFirebaseConfig && myFirebaseConfig.apiKey) {
          state.useFirebase = true;
          const app = initializeApp(myFirebaseConfig);
          const auth = getAuth(app);
          db = getFirestore(app);
          appId = 'nantou-event-room-2'; 

          document.getElementById('network-status').innerText = `連線同步中... (身分: ${ROLE_NAMES[state.role]})`;

          try {
            await signInAnonymously(auth);
          } catch (e) {
            fallbackToOffline('單機模式 (需至 Firebase 開啟匿名登入)');
            return;
          }

          onAuthStateChanged(auth, (currentUser) => {
            state.user = currentUser;
            if (currentUser) setupFirestoreListener();
          });
        } else {
          fallbackToOffline('單機模式 (未設定 Firebase 金鑰)');
        }
      } catch (err) {
        fallbackToOffline('單機模式 (連線失敗)');
      }
    }

    // ==========================================
    // 2. 核心邏輯：接收並換算進度，控制面板與音樂
    // ==========================================
    function setupFirestoreListener() {
      const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tablets', 'shared_state');
      onSnapshot(docRef, (docSnap) => {
        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('tablet-grid').classList.remove('hidden');
        
        let data = docSnap.exists() ? docSnap.data() : { clicks: 0, isTriggered: false, bgmPlaying: false };
        processNewState(data);
      }, () => fallbackToOffline('單機模式 (讀取失敗)'));
    }

    function processNewState(data) {
      const clicks = data.clicks || 0;
      const isTriggered = data.isTriggered || false;
      const bgmPlaying = data.bgmPlaying || false;
      
      let newProgress = isTriggered ? 100 : Math.min(99, clicks * 0.5);
      let newLitCount = Math.min(13, Math.floor(newProgress / 7.6));

      if (newLitCount > state.litCount) playClickSound();

      state.globalProgress = newProgress;
      state.litCount = newLitCount;
      state.bgmPlaying = bgmPlaying;
      
      renderGrid();
      updateProgressUI();

      // ==========================================
      // 控制背景音樂 (BGM) 的同步播放
      // ==========================================
      if (bgmPlaying && !isTriggered) {
        if (bgmAudio.paused) {
          bgmAudio.play().catch(e => console.warn('瀏覽器阻擋背景音樂播放，請確認是否有互動過', e));
        }
        document.querySelectorAll('.text-bgm-label').forEach(el => el.innerText = '⏸️ 暫停音樂');
      } else {
        if (!bgmAudio.paused) {
          bgmAudio.pause();
        }
        document.querySelectorAll('.text-bgm-label').forEach(el => el.innerText = '▶️ 播放音樂');
      }

      // ==========================================
      // 控制 100% 慶祝視窗 與 99% 地圖視窗
      // ==========================================
      const mapModal = document.getElementById('map-modal');

      if (newProgress === 100 && !state.isComplete) {
        state.isComplete = true;
        mapModal.classList.add('hidden');
        window.showCelebrationModal();
      } else if (newProgress < 100 && state.isComplete) {
        state.isComplete = false;
        window.hideCelebrationModal();
      }

      // 如果達到 99% 且尚未觸發 100%，顯示地圖視窗
      if (newProgress === 99 && !isTriggered) {
        mapModal.classList.remove('hidden');
      } else {
        mapModal.classList.add('hidden');
      }

      // ==========================================
      // 依照身分動態隱藏/顯示操作按鈕
      // ==========================================
      const modalRightPanel = document.getElementById('modal-right-panel');
      const panelMayor = document.getElementById('panel-mayor');
      const panelAdminModal = document.getElementById('panel-admin-modal');
      const panelAdminBottom = document.getElementById('panel-admin');
      const panelLighter = document.getElementById('panel-lighter');
      const panelSpacer = document.getElementById('panel-spacer');

      // 重置右側面板狀態
      modalRightPanel.classList.add('hidden');
      modalRightPanel.classList.remove('flex');
      panelMayor.classList.add('hidden');
      panelAdminModal.classList.add('hidden');
      panelAdminModal.classList.remove('flex');

      // 99% 時，所有人都要能看到右側面板，藉此顯示標題文字！
      if (newProgress === 99 && !isTriggered) {
        modalRightPanel.classList.remove('hidden');
        modalRightPanel.classList.add('flex');
      }

      if (state.role === 'mayor') {
        panelAdminBottom.classList.add('hidden');
        panelSpacer.classList.add('hidden');
        // 99% 時，縣長顯示地圖右側的達標按鈕
        if (newProgress === 99 && !isTriggered) {
          panelMayor.classList.remove('hidden');
        }
      } else if (state.role === 'admin') {
        // 99% 時，管理者顯示地圖右側的備用控制按鈕，隱藏主畫面底部的按鈕
        if (newProgress === 99 && !isTriggered) {
          panelAdminModal.classList.remove('hidden');
          panelAdminModal.classList.add('flex');
          panelAdminBottom.classList.add('hidden');
          panelSpacer.classList.add('hidden');
        } else {
          panelAdminBottom.classList.remove('hidden');
          panelSpacer.classList.remove('hidden');
        }
      } else {
        // 貴賓與其他角色，隱藏管理者及右側的按鈕，只保留標題
        panelAdminBottom.classList.add('hidden');
        panelSpacer.classList.add('hidden');
      }

      // 控制貴賓「點擊進度」按鈕：只要大於等於 99%，就自動消失把畫面讓給地圖
      if (state.role === 'lighter') {
        if (newProgress >= 99) {
          panelLighter.classList.add('hidden');
        } else {
          panelLighter.classList.remove('hidden');
        }
      } else {
        panelLighter.classList.add('hidden');
      }
    }

    // ==========================================
    // 3. UI 渲染：平板與進度條
    // ==========================================
    function renderGrid() {
      const grid = document.getElementById('tablet-grid');
      grid.innerHTML = '';

      const rows = [ TOWNSHIPS.slice(0, 6), TOWNSHIPS.slice(6, 13) ];

      rows.forEach(rowTowns => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'flex flex-wrap justify-center gap-2 sm:gap-3 md:gap-4 lg:gap-5 w-full';
        
        rowTowns.forEach(town => {
          const lightingIndex = LIGHTING_ORDER.indexOf(town.id);
          const isLit = lightingIndex < state.litCount;
          const btn = document.createElement('div');
          
          let btnClasses = isLit 
            ? 'bg-white scale-105 transform ring-2 md:ring-4 ring-[#317EE0] animate-lit-tablet'
            : 'bg-white shadow-md';

          btn.className = `group relative flex flex-col items-center justify-center w-[100px] h-[140px] sm:w-[110px] sm:h-[155px] md:w-[115px] md:h-[160px] lg:w-[130px] lg:h-[185px] rounded-[1rem] md:rounded-[1.25rem] transition-all duration-500 ${btnClasses}`;

          let innerBg = isLit ? 'bg-gradient-to-br from-[#317EE0] to-[#2563B0]' : 'bg-slate-800';
          let innerHtml = isLit ? `
            <div class="absolute inset-0 bg-white/10 animate-pulse"></div>
            <img src="nantoulogo_lightblue.png" class="w-10 h-10 md:w-12 md:h-12 object-contain mb-1 md:mb-2 z-10 drop-shadow-[0_0_12px_rgba(255,255,255,0.8)]" alt="Logo" onerror="this.style.display='none'">
            <span class="text-lg md:text-xl font-black text-white tracking-widest drop-shadow-md z-10">${town.name}</span>
          ` : `
            ${SVGS.tablet}
            <span class="text-sm md:text-base font-bold text-slate-400 tracking-widest">${town.name}</span>
          `;

          btn.innerHTML = `
            <div class="absolute top-[6px] bottom-[6px] left-[6px] right-[6px] md:top-2 md:bottom-2 md:left-2 md:right-2 rounded-lg flex flex-col items-center justify-center overflow-hidden transition-colors duration-500 ${innerBg} shadow-inner">
              ${innerHtml}
              <div class="absolute bottom-1 md:bottom-1.5 left-1/2 transform -translate-x-1/2 w-8 md:w-10 h-1 rounded-full ${isLit ? 'bg-white/80' : 'bg-white/20'}"></div>
            </div>
            <div class="absolute top-[3px] left-1/2 transform -translate-x-1/2 w-[3px] h-[3px] md:w-[4px] md:h-[4px] rounded-full bg-slate-300"></div>
          `;
          rowDiv.appendChild(btn);
        });
        grid.appendChild(rowDiv);
      });
    }

    function updateProgressUI() {
      const percent = state.globalProgress;
      const displayPercent = percent % 1 === 0 ? percent : percent.toFixed(1);
      document.getElementById('progress-bar-fill').style.width = `${percent}%`;
      document.getElementById('progress-text').innerText = `完成度 ${displayPercent}% (${state.litCount}/13)`;

      const container = document.getElementById('progress-container');
      container.classList.remove('animate-progress-bump');
      void container.offsetWidth; 
      container.classList.add('animate-progress-bump');
    }

    // ==========================================
    // 4. 按鈕操作邏輯 (點燈、達標、音樂控制、重置)
    // ==========================================
    
    window.handleToggleBGM = async () => {
      const isPlaying = state.bgmPlaying;
      if (state.useFirebase && state.user) {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tablets', 'shared_state');
        try {
          await setDoc(docRef, { bgmPlaying: !isPlaying }, { merge: true });
        } catch(e) {}
      } else {
        processNewState({ clicks: state.globalProgress / 0.5, isTriggered: state.isComplete, bgmPlaying: !isPlaying });
      }
    };

    window.handleLighterClick = async () => {
      if (state.globalProgress >= 99) return;
      playTapSound();
      if (state.useFirebase && state.user) {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tablets', 'shared_state');
        try {
          await setDoc(docRef, { clicks: increment(1) }, { merge: true });
        } catch(e) {}
      } else {
        processNewState({ clicks: (state.globalProgress / 0.5) + 1, isTriggered: false, bgmPlaying: state.bgmPlaying });
      }
    };

    window.handleAdminTarget = async () => {
      if (state.useFirebase && state.user) {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tablets', 'shared_state');
        try {
          await setDoc(docRef, { isTriggered: true }, { merge: true });
        } catch(e) {}
      } else {
        processNewState({ clicks: 0, isTriggered: true, bgmPlaying: state.bgmPlaying });
      }
    };

    window.handleReset = async () => {
      stopCelebrationSound(); 
      stopConfetti(); 
      if (state.useFirebase && state.user) {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tablets', 'shared_state');
        try { 
          // 重置時一併關閉背景音樂
          await setDoc(docRef, { clicks: 0, isTriggered: false, bgmPlaying: false }); 
        } catch (e) {}
      } else {
        processNewState({ clicks: 0, isTriggered: false, bgmPlaying: false });
      }
    };

    window.handleBackTo99 = async () => {
      stopCelebrationSound(); 
      stopConfetti(); 
      if (state.useFirebase && state.user) {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tablets', 'shared_state');
        try { 
          await setDoc(docRef, { clicks: 198, isTriggered: false, bgmPlaying: state.bgmPlaying }); 
        } catch (e) {}
      } else {
        processNewState({ clicks: 198, isTriggered: false, bgmPlaying: state.bgmPlaying });
      }
    };

    // ==========================================
    // 5. 慶祝視窗與特效
    // ==========================================
    function stopConfetti() {
      if (state.confettiInterval) {
        clearInterval(state.confettiInterval);
        state.confettiInterval = null;
      }
      if (window.confetti) window.confetti.reset();
    }

    window.showCelebrationModal = () => {
      const modal = document.getElementById('celebration-modal');
      modal.classList.remove('hidden');
      playCelebrationSound();
      const duration = 25 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

      function randomInRange(min, max) { return Math.random() * (max - min) + min; }

      if (state.confettiInterval) clearInterval(state.confettiInterval);

      state.confettiInterval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(state.confettiInterval);
        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    };

    window.hideCelebrationModal = () => {
      stopCelebrationSound(); 
      stopConfetti();
      document.getElementById('celebration-modal').classList.add('hidden');
    };

  </script>
</body>
</html>
