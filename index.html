<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南投縣生生有平板達標宣布活動</title>

  <link rel="icon" href="42531_f5.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes popIn {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }

      80% {
        transform: scale(1.05);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes float-particle {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.5;
      }

      50% {
        transform: translateY(-20px) rotate(180deg);
        opacity: 1;
      }
    }

    /* 進度條推進時的 Q彈發光特效 (科技藍 #317EE0) */
    @keyframes progressBump {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(49, 126, 224, 0.8);
        border-color: rgba(49, 126, 224, 1);
      }

      100% {
        transform: scale(1);
      }
    }

    /* 南投100%標籤的閃動強調特效 (活力橘 #FF7145) */
    @keyframes badgePulse {

      0%,
      100% {
        transform: rotate(-2deg) scale(1);
        filter: brightness(1);
        box-shadow: 0 0 15px rgba(255, 113, 69, 0.6);
      }

      50% {
        transform: rotate(-2deg) scale(1.1);
        filter: brightness(1.05);
        box-shadow: 0 0 40px rgba(255, 113, 69, 1), inset 0 0 15px rgba(255, 255, 255, 0.6);
      }
    }

    /* 點亮平板的強烈閃爍發光特效 (科技藍 #317EE0) */
    @keyframes litTabletGlow {

      0%,
      100% {
        box-shadow: 0 5px 15px rgba(49, 126, 224, 0.5);
        filter: brightness(1);
      }

      50% {
        box-shadow: 0 0 30px rgba(49, 126, 224, 1);
        filter: brightness(1.15);
      }
    }

    /* 跑進度條紋特效 */
    @keyframes progress-stripes-anim {
      from {
        background-position: 1.5rem 0;
      }

      to {
        background-position: 0 0;
      }
    }

    .progress-stripes {
      background-image: linear-gradient(-45deg,
          rgba(255, 255, 255, 0.25) 25%,
          transparent 25%,
          transparent 50%,
          rgba(255, 255, 255, 0.25) 50%,
          rgba(255, 255, 255, 0.25) 75%,
          transparent 75%,
          transparent);
      background-size: 1.5rem 1.5rem;
      animation: progress-stripes-anim 1s linear infinite;
    }

    /* 標題：藍字白邊風格 */
    .title-outline {
      color: #317EE0;
      -webkit-text-stroke: 4px white;
      paint-order: stroke fill;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.1));
    }

    @supports not (paint-order: stroke fill) {
      .title-outline {
        -webkit-text-stroke: 0;
        text-shadow:
          -3px -3px 0 #fff, 0 -3px 0 #fff, 3px -3px 0 #fff,
          3px 0 0 #fff, 3px 3px 0 #fff, 0 3px 0 #fff,
          -3px 3px 0 #fff, -3px 0 0 #fff;
      }
    }

    .animate-pop-in {
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .animate-progress-bump {
      animation: progressBump 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .animate-badge-pulse {
      animation: badgePulse 1.2s ease-in-out infinite;
    }

    .animate-lit-tablet {
      animation: litTabletGlow 1.5s ease-in-out infinite;
    }

    /* 適合亮色系的網格背景 (科技藍 #317EE0) */
    .grid-bg {
      background-size: 40px 40px;
      background-image:
        linear-gradient(to right, rgba(49, 126, 224, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(49, 126, 224, 0.08) 1px, transparent 1px);
    }
  </style>
</head>

<body

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // 🎵 載入自訂音效
    const clickAudio = new Audio('click.mp3');
    const celebrationAudio = new Audio('party.mp3');

    function playClickSound() {
      try {
        clickAudio.currentTime = 0;
        const playPromise = clickAudio.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => { console.warn("點擊音效播放遭阻擋或檔案遺失"); });
        }
      } catch (e) { }
    }

    function playCelebrationSound() {
      try {
        celebrationAudio.currentTime = 0;
        const playPromise = celebrationAudio.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => { console.warn("慶祝音效播放遭阻擋或檔案遺失"); });
        }
      } catch (e) { }
    }

    function stopCelebrationSound() {
      try {
        celebrationAudio.pause();
        celebrationAudio.currentTime = 0;
      } catch (e) { }
    }

    // ==========================================
    // 🔥 步驟四：在這裡填入您的 Firebase 設定碼
    // ==========================================
    const myFirebaseConfig = {
      apiKey: "AIzaSyCWVUoWYFWBAqYYJjLfD1iLumZWTfuYMwg",
      authDomain: "tabletactive-c60bd.firebaseapp.com",
      projectId: "tabletactive-c60bd",
      storageBucket: "tabletactive-c60bd.firebasestorage.app",
      messagingSenderId: "161436470838",
      appId: "1:161436470838:web:ed3269e37a1f12c5211297",
      measurementId: "G-GK0B28W9L2"
    };
    // ==========================================

    const TOWNSHIPS = [
      { id: 'nantou', name: '南投市' }, { id: 'caotun', name: '草屯鎮' }, { id: 'zhongliao', name: '中寮鄉' },
      { id: 'mingjian', name: '名間鄉' }, { id: 'jiji', name: '集集鎮' }, { id: 'shuili', name: '水里鄉' },
      { id: 'xinyi', name: '信義鄉' }, { id: 'puli', name: '埔里鎮' }, { id: 'guoxing', name: '國姓鄉' },
      { id: 'yuchi', name: '魚池鄉' }, { id: 'renai', name: '仁愛鄉' }, { id: 'zhushan', name: '竹山鎮' },
      { id: 'lugu', name: '鹿谷鄉' }
    ];

    let state = {
      litStatus: {},
      isComplete: false,
      useFirebase: false,
      user: null,
      litCount: 0
    };

    let db, appId;

    // --- SVG 圖示 ---
    const SVGS = {
      tablet: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 md:w-8 md:h-8 text-slate-400 mb-1 md:mb-2"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg>`,
      sparkles: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 md:w-10 md:h-10 text-white mb-1 md:mb-2 drop-shadow-md"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>`
    };

    function fallbackToOffline(errorMessage = '單機模式・(設定檔有誤)') {
      state.useFirebase = false;
      document.getElementById('network-status').innerText = errorMessage;
      document.getElementById('network-status').classList.replace('text-[#317EE0]', 'text-slate-500');
      document.getElementById('loading-spinner').classList.add('hidden');
      document.getElementById('tablet-grid').classList.remove('hidden');
      TOWNSHIPS.forEach(t => state.litStatus[t.id] = false);
      renderGrid();
      updateProgress();
    }

    async function init() {
      try {
        if (myFirebaseConfig && myFirebaseConfig.apiKey) {
          state.useFirebase = true;
          const app = initializeApp(myFirebaseConfig);
          const auth = getAuth(app);
          db = getFirestore(app);
          appId = 'nantou-event-room-1';

          document.getElementById('network-status').innerText = '多人連線模式・連線同步中...';

          try {
            await signInAnonymously(auth);
          } catch (authError) {
            console.error("登入失敗", authError);
            fallbackToOffline('連線失敗：請至 Firebase 開啟「匿名登入」');
            return;
          }

          onAuthStateChanged(auth, (currentUser) => {
            state.user = currentUser;
            if (currentUser) setupFirestoreListener();
          });
        } else {
          fallbackToOffline('單機模式・(若需連線請填入 Firebase 設定)');
        }
      } catch (err) {
        fallbackToOffline('連線失敗，已切換為單機模式');
      }
    }

    function setupFirestoreListener() {
      const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tablets', 'shared_state');
      onSnapshot(docRef, (docSnap) => {
        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('tablet-grid').classList.remove('hidden');

        if (docSnap.exists()) {
          state.litStatus = docSnap.data();
        } else {
          state.litStatus = {};
        }

        renderGrid();
        updateProgress();
      }, (err) => {
        fallbackToOffline('資料庫讀取失敗，切換為單機模式');
      });
    }

    function renderGrid() {
      const grid = document.getElementById('tablet-grid');
      grid.innerHTML = '';

      const rows = [
        TOWNSHIPS.slice(0, 6),
        TOWNSHIPS.slice(6, 13)
      ];

      rows.forEach(rowTowns => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'flex flex-wrap justify-center gap-2 sm:gap-3 md:gap-4 lg:gap-5 w-full';

        rowTowns.forEach(town => {
          const isLit = state.litStatus[town.id];
          const btn = document.createElement('button');
          btn.onclick = () => window.handleTabletClick(town.id);

          let btnClasses = isLit
            ? 'bg-white scale-105 transform cursor-pointer ring-2 md:ring-4 ring-[#317EE0] animate-lit-tablet'
            : 'bg-white hover:-translate-y-1 hover:shadow-xl cursor-pointer shadow-md';

          btn.className = `group relative flex flex-col items-center justify-center w-[100px] h-[140px] sm:w-[110px] sm:h-[155px] md:w-[115px] md:h-[160px] lg:w-[130px] lg:h-[185px] rounded-[1rem] md:rounded-[1.25rem] transition-all duration-500 ${btnClasses}`;

          let innerBg = isLit ? 'bg-gradient-to-br from-[#317EE0] to-[#2563B0]' : 'bg-slate-800';

          let innerHtml = isLit ? `
            <div class="absolute inset-0 bg-white/10 animate-pulse"></div>
            ${SVGS.sparkles}
            <span class="text-lg md:text-xl font-black text-white tracking-widest drop-shadow-md z-10">${town.name}</span>
          ` : `
            ${SVGS.tablet}
            <span class="text-sm md:text-base font-bold text-slate-400 tracking-widest">${town.name}</span>
          `;

          btn.innerHTML = `
            <div class="absolute top-[6px] bottom-[6px] left-[6px] right-[6px] md:top-2 md:bottom-2 md:left-2 md:right-2 rounded-lg flex flex-col items-center justify-center overflow-hidden transition-colors duration-500 ${innerBg} shadow-inner">
              ${innerHtml}
              <div class="absolute bottom-1 md:bottom-1.5 left-1/2 transform -translate-x-1/2 w-8 md:w-10 h-1 rounded-full ${isLit ? 'bg-white/80' : 'bg-white/20'}"></div>
            </div>
            <div class="absolute top-[3px] left-1/2 transform -translate-x-1/2 w-[3px] h-[3px] md:w-[4px] md:h-[4px] rounded-full bg-slate-300"></div>
          `;
          rowDiv.appendChild(btn);
        });

        grid.appendChild(rowDiv);
      });
    }

    function updateProgress() {
      const newLitCount = Object.values(state.litStatus).filter(Boolean).length;
      const percent = Math.round((newLitCount / 13) * 100);

      document.getElementById('progress-bar-fill').style.width = `${percent}%`;
      document.getElementById('progress-text').innerText = `完成度 ${percent}% (${newLitCount}/13)`;

      if (newLitCount > state.litCount) {
        const container = document.getElementById('progress-container');
        container.classList.remove('animate-progress-bump');
        void container.offsetWidth;
        container.classList.add('animate-progress-bump');
      }
      state.litCount = newLitCount;

      const allLit = (newLitCount === 13);
      if (allLit && !state.isComplete) {
        state.isComplete = true;
        window.showCelebrationModal();
        document.getElementById('control-panel').classList.remove('hidden');
      } else if (!allLit && state.isComplete) {
        state.isComplete = false;
        window.hideCelebrationModal();
        document.getElementById('control-panel').classList.add('hidden');
      }
    }

    window.handleTabletClick = async (townId) => {
      if (state.litStatus[townId]) return;

      playClickSound();

      if (state.useFirebase && state.user) {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tablets', 'shared_state');
        try {
          await setDoc(docRef, { [townId]: true }, { merge: true });
        } catch (e) { console.error(e); }
      } else {
        state.litStatus[townId] = true;
        renderGrid();
        updateProgress();
      }
    };

    window.handleReset = async () => {
      stopCelebrationSound();

      if (state.useFirebase && state.user) {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tablets', 'shared_state');
        const resetData = {};
        TOWNSHIPS.forEach(t => resetData[t.id] = false);
        try { await setDoc(docRef, resetData); } catch (e) { console.error(e); }
      } else {
        TOWNSHIPS.forEach(t => state.litStatus[t.id] = false);
        renderGrid();
        updateProgress();
      }
    };

    window.showCelebrationModal = () => {
      const modal = document.getElementById('celebration-modal');
      modal.classList.remove('hidden');

      playCelebrationSound();

      const duration = 25 * 1000;
      const animationEnd = Date.now() + duration;
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

      function randomInRange(min, max) { return Math.random() * (max - min) + min; }

      const interval = setInterval(function () {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        const particleCount = 50 * (timeLeft / duration);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
    };

    window.hideCelebrationModal = () => {
      stopCelebrationSound();
      document.getElementById('celebration-modal').classList.add('hidden');
    };

    init();
  </script>
</body>

</html>
